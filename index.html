<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Cutter Entry - Essentials By D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader video { 
            object-fit: cover; 
            border-radius: 1rem; 
            width: 100% !important;
        }
        #reader { border: none !important; background: transparent !important; }
        #reader__dashboard_section_csr, #reader__dashboard_section_swaplink, #reader select {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center p-4 font-sans select-none">

    <!-- App Header -->
    <header class="w-full text-center py-4 border-b border-slate-800">
        <h1 class="text-xl font-black tracking-widest text-amber-400">ESSENTIALS BY D</h1>
        <p class="text-xs text-slate-400 font-medium mt-0.5">Master Cutter Quick Entry Panel</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-sm my-auto flex flex-col items-center">
        
        <!-- START SCREEN (Button to Open Camera) -->
        <div id="start-screen" class="w-full bg-slate-900/90 p-6 rounded-3xl border border-slate-800 shadow-2xl text-center space-y-4 backdrop-blur-md">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl mx-auto flex items-center justify-center text-3xl border border-amber-500/20">
                📷
            </div>
            <div>
                <h2 class="text-lg font-bold text-white">Fabric Scanning Ready</h2>
                <p class="text-xs text-slate-400 mt-1">Barcode scan karne ke liye neechay button dabayein</p>
            </div>
            <button onclick="openCamera()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-black py-4 rounded-2xl shadow-xl transition text-base tracking-wide flex items-center justify-center gap-2">
                <span>⚡</span> <span>OPEN CAMERA & SCAN</span>
            </button>
        </div>

        <!-- SCANNER BOX (Hidden initially, opens on button click) -->
        <div id="scanner-container" class="w-full bg-slate-900/90 p-4 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-md hidden">
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">📷 Scanner Active</span>
                <button onclick="closeCamera()" class="text-[11px] bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-full font-bold border border-rose-500/20">
                    ✕ Stop Camera
                </button>
            </div>
            
            <!-- Camera Render Box -->
            <div id="reader" class="w-full overflow-hidden rounded-2xl bg-black border border-slate-800 min-h-[260px]"></div>
            
            <!-- Switch Camera Button -->
            <button onclick="switchCamera()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 border border-slate-700">
                <span>🔄</span> <span>Switch Front / Back Camera</span>
            </button>
        </div>

    </main>

    <!-- Quick Footer -->
    <footer class="w-full text-center py-2 text-[10px] text-slate-600">
        Mobile Scanner Mode • Button Controlled
    </footer>

    <!-- POPUP MODAL (CUT ONLY) -->
    <div id="cut-popup" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 transition-all">
        <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 w-full max-w-xs shadow-2xl relative">
            
            <!-- Close Button -->
            <button onclick="closePopup()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center text-sm">
                ✕
            </button>

            <!-- Scanned Code Header -->
            <div class="text-center mb-5 mt-2">
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[11px] px-3 py-1 rounded-full font-mono font-bold tracking-wider uppercase inline-block mb-2" id="popup-barcode">
                    CODE: ---
                </span>
                <h3 class="text-base font-bold text-white" id="popup-title">Fabric Scanned</h3>
            </div>

            <!-- Meter Entry Section -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5 text-center">
                        Kitne Meter Cut Kiya?
                    </label>
                    <div class="relative">
                        <input type="number" 
                               id="meters-input" 
                               step="0.1" 
                               inputmode="decimal"
                               placeholder="0.0" 
                               class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-400 rounded-2xl px-4 py-3 text-2xl text-center font-black text-amber-400 outline-none transition-colors">
                        <span class="absolute right-4 top-4 text-xs font-bold text-slate-500">Meters</span>
                    </div>
                </div>

                <!-- Single Cut Action Button -->
                <div class="pt-2">
                    <button onclick="submitCut()" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base">
                        <span>✂️</span> <span>CONFIRM CUT</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let html5QrCode = null;
        let currentFacingMode = "environment"; 
        let lastScannedCode = "";

        function openCamera() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('scanner-container').classList.remove('hidden');
            startScanner();
        }

        function closeCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!decodedText || decodedText.trim() === "") return;
            
            lastScannedCode = decodedText;
            
            document.getElementById('popup-barcode').innerText = "CODE: " + decodedText;
            document.getElementById('popup-title').innerText = "Fabric Code #" + decodedText;
            document.getElementById('meters-input').value = '';
            
            document.getElementById('cut-popup').classList.remove('hidden');

            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.pause();
            }
        }

        function closePopup() {
            document.getElementById('cut-popup').classList.add('hidden');
            if(html5QrCode) {
                html5QrCode.resume();
            }
        }

        function submitCut() {
            const meters = document.getElementById('meters-input').value;
            if (!meters || meters <= 0) {
                alert("Please meter enter karein!");
                return;
            }

            alert(`✂️ Cut Recorded Successfully!\n\nFabric Code: ${lastScannedCode}\nDeducted Meters: ${meters}m`);
            closePopup();
        }

        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            const config = { fps: 15, qrbox: { width: 200, height: 200 } };
            
            html5QrCode.start(
                { facingMode: currentFacingMode }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.error("Camera start error", err);
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
            });
        }

        function switchCamera() {
            if (!html5QrCode) return;
            
            html5QrCode.stop().then(() => {
                currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                startScanner();
            }).catch(err => {
                console.error("Failed to clear scanner. ", err);
            });
        }
    </script>
</body>
</html>


<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#17233a;--mu:#5d6b82;--ac:#1f3a6e;--ac2:#e9b824;--bd:#d5dbe6;--ok:#1e7a46;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--tx:#e8edf7;--mu:#9aa8c2;--ac:#8fb0f0;--ac2:#e9b824;--bd:#2a3858;--ok:#4cc380;--bad:#ff8a80}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px;border-bottom:5px solid var(--ac2)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#22305a;color:#fff}}
nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#0f1624}}
main{padding:14px 12px 40px;max-width:1100px;margin:auto}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:140px}

label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:3px}
button.b{font:inherit;padding:9px 14px;border-radius:7px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b{color:#0f1624}}
button.g{background:transparent;color:var(--ac)}button.r{background:var(--bad);border-color:var(--bad);color:#fff}button.y{background:var(--ac2);border-color:var(--ac2);color:#222}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac2);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac2);border-radius:8px;padding:10px 12px}
.stats b{display:block;font-size:22px}.stats span{font-size:12.5px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12.5px;color:var(--mu);font-weight:600}
.low{color:var(--bad);font-weight:700}.tag{display:inline-block;background:var(--bad);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:6px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.big{font-size:20px;padding:13px}.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--bd);vertical-align:-2px;margin-right:5px}

dialog::backdrop{background:rgba(0,0,0,.5)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

video{width:100%;max-height:260px;border-radius:8px;background:#000;display:none;margin-top:10px}
.mm header,.mm nav,.mm .fab{display:none}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:14px 20px;border-radius:99px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.lbs{display:flex;flex-wrap:wrap;gap:10px}.lbp{background:#fff;color:#000;border:1px dashed #999;padding:5px;font:11px/1.2 Arial,sans-serif;overflow:hidden}
.lbp b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbp .s{text-align:center;letter-spacing:1.5px;font:11px monospace}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}body{background:#fff}#pa{display:block!important}
.th .lbp{border:0;page-break-after:always;break-after:page}.a4{display:flex;flex-wrap:wrap;gap:3mm}.a4 .lbp{border:1px dashed #bbb}
#pa table{min-width:0;font:11px Arial,sans-serif;color:#000}#pa th,#pa td{border:1px solid #888;padding:3px 5px;color:#000}}

<header><h1>Fabric Inventory</h1><p>Stock, barcode scan and label printing</p></header>
<nav id="nav"></nav><div id="bn" style="padding:0 12px;max-width:1100px;margin:auto"></div><main id="app"></main><div id="toast" class="msg" style="display:none;position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;background:var(--ac2);color:#222;border-left-color:#222;font-weight:600"></div>
<div id="pa"></div><style id="pg"></style>

<dialog id="qd"><h3 style="margin:0 0 6px">Master QR code</h3>

<button class="b y fab" onclick="cOpen()">Scan &amp; cut</button>

<video id="cv" playsinline muted></video><div id="cr"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* STEP 1: paste your Firebase web app config here (see README.md) */
const FIREBASE_CONFIG={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT.firebaseapp.com",projectId:"PASTE_PROJECT_ID",appId:"PASTE_APP_ID"};
/* STEP 2: the owner email (the one who adds/edits fabrics) */
const OWNER_EMAIL="owner@example.com";
</script>
<script>
const P="212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(",");
function bc(t,h){let v=[104],s=104;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i)-32;v.push(c);s+=c*(i+1)}v.push(s%103,106);let x=10,r="";v.forEach(c=>{const p=P[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="100"/>`;x+=w}});x+=10;return `<svg viewBox="0 0 ${x} 100" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" fill="#000">${r}</svg>`}
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D={items:[],log:[],n:1},tab="stock",q="",sel={},scanned=null,editId=null,cs="a";
let OLD=null;try{const x=localStorage.getItem("fabricInv1");if(x){OLD=JSON.parse(x);D.master=OLD.master||""}}catch(e){}
function save(){try{localStorage.setItem('fabricInv1',JSON.stringify(Object.assign({},OLD||{},{master:D.master})))}catch(e){}}
let db=null,IT=[],MV=[],canW=true,isOwn=false,ready=false;
function derive(){const m={};MV.forEach(v=>{const a=m[v.iid]||(m[v.iid]={inn:0,used:0,last:null});if(v.d>0)a.inn+=v.d;else a.used-=v.d;if(v.k==='cut'&&(!a.last||v.ts>a.last.ts))a.last=v});
 D.items=IT.map(i=>{const a=m[i.id]||{inn:0,used:0,last:null};return Object.assign({},i,{inn:+a.inn.toFixed(3),used:+a.used.toFixed(3),qty:+(a.inn-a.used).toFixed(3),last:a.last})}).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 D.n=1+Math.max(0,...IT.map(i=>parseInt(String(i.sku||'').replace(/^FB/,''))||0));
 D.log=MV.slice().sort((a,b)=>b.ts-a.ts).slice(0,500).map(v=>({t:new Date(v.ts).toLocaleString(),sku:v.sku,name:v.nm,d:v.d,u:v.u,note:v.note||'',k:v.k}))}
function note(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>e.style.display='none',9000)}
function bn(h){$('bn').innerHTML=h?`<div class="msg" style="margin:10px 0 0">${h}</div>`:''}
function refresh(){derive();if(pend&&ready&&IT.length){const s=pend;pend=null;if(!$('cd').open)$('cd').showModal();$('cr').innerHTML='';cFind(s)}if(tab==='stock'){document.activeElement&&document.activeElement.id==='qs'?vStockRows():render()}else if(tab==='log')render()}
async function importOld(){if(!OLD||!OLD.items)return;bn('Importing...');try{for(const x of OLD.items){const {qty,...f}=x;await db.collection('items').doc(x.id).set(f);if(qty>0)await addLog(x,qty,'Opening stock (imported)','open')}OLD={master:D.master};save();bn('')}catch(e){bn('Import failed. Only the owner can import fabrics.')}}
let started=false;
function loginUI(msg){$("app").innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3 style="margin-top:0">Sign in</h3><label>Email</label><input id="le" type="email" autocomplete="username"><label style="margin-top:8px">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><div style="margin-top:12px"><button class="b" onclick="doLogin()">Sign in</button></div>${msg?`<p class="low">${esc(msg)}</p>`:""}</div>`}
function doLogin(){firebase.auth().signInWithEmailAndPassword($("le").value.trim(),$("lp").value).catch(()=>loginUI("Wrong email or password"))}
function startApp(user){if(started)return;started=true;db=firebase.firestore();isOwn=(user.email||"").toLowerCase()===OWNER_EMAIL.toLowerCase();canW=true;
 const tm=setTimeout(()=>bn('Stock is taking long to load. Check your internet.'),10000);let f1=0;
 db.collection('items').onSnapshot(s=>{clearTimeout(tm);IT=s.docs.map(d=>Object.assign({id:d.id},d.data()));derive();if(!f1){f1=1;if(isOwn&&OLD&&OLD.items&&OLD.items.length&&!IT.length)bn(`This browser has ${OLD.items.length} saved fabrics. <button class="b y" onclick="importOld()">Import to shared stock</button>`)}refresh()},e=>bn('Could not load stock: '+esc(e.message)));
 db.collection('moves').onSnapshot(s=>{MV=s.docs.map(d=>d.data());derive();if(ready)s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites){const v=c.doc.data();note((v.by||'Master')+': '+(v.d<0?'used ':'added ')+Math.abs(v.d)+' '+v.u+' - '+v.nm)}});ready=true;refresh()},e=>bn('Could not load history: '+esc(e.message)))}
try{firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().onAuthStateChanged(u=>{if(u){bn("");startApp(u)}else{started=false;loginUI()}})}catch(e){bn("Firebase is not set up yet. Fill FIREBASE_CONFIG at the top of index.html (see README.md).")}
const DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}};
const tabs={stock:"Stock",scan:"Scan in / out",labels:"Print labels",log:"History"};
function nav(){$("nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(t){try{stopCam()}catch(e){}tab=t;render()}
function render(){if(MM){vMaster();return}nav();({stock:vStock,scan:vScan,labels:vLabels,log:vLog})[tab]();if(tab=="scan")setTimeout(()=>$("sc")&&$("sc").focus(),50)}
const money=n=>(+n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const isLow=i=>+i.qty<=+i.min;
 
function vStock(){
 const L=D.items.filter(i=>(i.name+i.sku+i.color+i.type+i.loc).toLowerCase().includes(q.toLowerCase()));
 const val=D.items.reduce((a,i)=>a+i.qty*i.price,0);
 $("app").innerHTML=`<div class="stats"><div><b>${D.items.length}</b><span>Fabric types</span></div><div><b>${money(D.items.reduce((a,i)=>a+ +i.qty,0))}</b><span>Total quantity</span></div><div><b>${D.items.filter(isLow).length}</b><span>Low stock</span></div><div><b>${money(val)}</b><span>Stock value</span></div></div>
 <div class="card"><div class="row"><div class="grow"><input id="qs" placeholder="Search name, color, barcode, location" value="${esc(q)}" oninput="q=this.value;vStockRows()"></div>
 <button class="b" onclick="openItem()">Add fabric</button><button class="b g" onclick="csv()">Export CSV</button><button class="b y" onclick="qrOpen()">Master QR</button><button class="b g" onclick="printReport()">Print report</button></div></div>
 <div class="card tw"><table><thead><tr><th>Fabric</th><th>Color</th><th>Width</th><th>Location</th><th>Received</th><th>Used (cut)</th><th>Balance</th><th>Barcode</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;vStockRows()}
function vStockRows(){
 const L=D.items.filter(i=>(i.name+i.sku+i.color+i.type+i.loc).toLowerCase().includes(q.toLowerCase()));
 $("rows").innerHTML=L.length?L.map(i=>`<tr><td><b>${esc(i.name)}</b><br><small style="color:var(--mu)">${esc(i.type)}</small></td><td><span class="sw" style="background:${esc(i.hex||"#ccc")}"></span>${esc(i.color)}</td><td>${esc(i.width)}</td><td>${esc(i.loc)}</td>
 <td>${money(i.inn)} ${esc(i.unit)}</td><td>${i.used?money(i.used)+" "+esc(i.unit)+(i.last?`<br><small style="color:var(--mu)">last: ${esc(i.last.by||"")} ${new Date(i.last.ts).toLocaleString()}</small>`:""):"-"}</td><td class="${isLow(i)?"low":""}"><b>${money(i.qty)} ${esc(i.unit)}</b>${isLow(i)?'<span class="tag">Low</span>':""}</td><td><div style="width:130px;background:#fff;padding:3px;border-radius:3px">${bc(i.sku,34)}</div><small>${esc(i.sku)}</small></td>
 <td style="white-space:nowrap"><button class="b y" onclick="printOne('${i.id}')">Print label</button> <button class="b g" onclick="openItem('${i.id}')">Edit</button> <button class="b g" onclick="del('${i.id}')">Delete</button></td></tr>`).join(""):`<tr><td colspan="9" style="color:var(--mu);padding:22px">No fabric found. Tap Add fabric to create the first item.</td></tr>`}
 
function openItem(id){editId=id||null;const i=id?D.items.find(x=>x.id==id):{sku:"FB"+String(D.n).padStart(6,"0"),unit:"m",qty:0,min:10,price:0,hex:"#1f3a6e"};
 $("dt").textContent=id?"Edit fabric":"Add fabric";
 const f=(k,l,t="text",ex="")=>`<div><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(i[k]??"")}" ${ex}></div>`;
 $("ff").innerHTML=f("name","Fabric name")+f("type","Type (cotton, silk...)")+f("color","Color name")+f("hex","Color swatch","color")+f("width","Width (e.g. 58 in)")+
 `<div><label>Unit</label><select id="f_unit">${["m","yd","roll","kg"].map(u=>`<option ${i.unit==u?"selected":""}>${u}</option>`).join("")}</select></div>`+
 f("qty","Quantity","number",'step="any" min="0"')+f("min","Low stock alert at","number",'step="any" min="0"')+f("price","Price per unit","number",'step="any" min="0"')+f("loc","Rack / location")+f("sku","Barcode (auto)");
 dlg.showModal()}
function saveItem(){const g=k=>$("f_"+k).value.trim();if(!g("name")){alert("Enter fabric name");return}
 const sku=g("sku").replace(/[^\x20-\x7e]/g,"")||"FB"+String(D.n).padStart(6,"0");
 if(D.items.some(x=>x.sku==sku&&x.id!=editId)){alert("This barcode is already used by another fabric");return}
 const o={name:g("name"),type:g("type"),color:g("color"),hex:g("hex"),width:g("width"),unit:g("unit"),qty:+g("qty")||0,min:+g("min")||0,price:+g("price")||0,loc:g("loc"),sku};
 persistItem(o);
 save();dlg.close();render()}
function del(id){const i=D.items.find(x=>x.id==id);if(confirm("Delete "+i.name+"?")){db.collection('items').doc(id).delete().catch(()=>alert('Only the owner can delete fabrics.'))}}
async function persistItem(o){const {qty,...f}=o;let id=editId;const old=id?D.items.find(x=>x.id==id):null;
 try{if(!id){id='i'+Date.now().toString(36);await db.collection('items').doc(id).set(f);if(qty>0)await addLog(Object.assign({id},f),qty,'Opening stock','open')}
 else{await db.collection('items').doc(id).set(f);const diff=+(qty-old.qty).toFixed(3);if(diff)await addLog(Object.assign({id},f),diff,'Manual adjustment','adj')}}
 catch(e){alert('Could not save. Only the owner can add or edit fabrics.')}}
async function addLog(i,d,nt,k){const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const v={iid:i.id,sku:i.sku,nm:i.name+(i.color?' '+i.color:''),d,u:i.unit,note:nt||'',k:k||(d>0?'in':'out'),ts:Date.now(),by:D.master||''};
 try{await db.collection('moves').doc(id).set(v)}catch(e){alert('Could not save to the shared database. You need Editor access to this page.');throw e}
 await new Promise(r=>setTimeout(r,150))}
 
function vScan(){
 $("app").innerHTML=`<div class="card"><label>Scan barcode (USB / Bluetooth scanner types here and presses Enter) or type it</label>
 <div class="row"><div class="grow"><input id="sc" class="big" placeholder="Scan now..." autocomplete="off" onkeydown="if(event.key=='Enter')find(this.value)"></div><button class="b y" onclick="cam()">Use camera</button></div>
 <video id="vd" playsinline muted></video><button id="cb" class="b r" style="display:none;margin-top:8px" onclick="stopCam()">Stop camera</button><div id="res"></div></div>`;if(scanned)find(scanned,1)}
function find(code,quiet){code=code.trim();const i=D.items.find(x=>x.sku.toLowerCase()==code.toLowerCase());scanned=i?i.sku:null;
